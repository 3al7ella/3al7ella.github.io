name: Capture 390px homepage before and after
on:
  workflow_run:
    workflows: ["Optimize storefront images"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Prepare before version
        run: git worktree add /tmp/before 8d81159ee3bd4a879d034c334e2b10a85e2a03f8
      - name: Start local web servers
        run: |
          python3 -m http.server 8000 --directory /tmp/before >/tmp/before.log 2>&1 &
          python3 -m http.server 8001 --directory . >/tmp/after.log 2>&1 &
          sleep 2
      - name: Capture 390px mobile screenshots
        run: node tools/capture_home_390.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-390-before-after
          path: |
            homepage-before-390.png
            homepage-after-390.png
          retention-days: 14
